
name: Research 02 Scientific Calibration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration:
    name: Max-T scientific calibration
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: python -m pip install -e ".[test]"

      - name: Execute scientific calibration
        run: python -m research_02.calibration

      - name: Preserve calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-02-calibration-results
          path: research_02/results/calibration.json
          if-no-files-found: warn
          retention-days: 90
