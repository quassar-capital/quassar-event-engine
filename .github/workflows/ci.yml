name: Event Engine CI

on:
  push:
    branches:
      - main
      - feature/event-engine-advanced-research-v1
      - research-02-high-dimensional-event-inference
  pull_request:
    branches:
      - main

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --manifest-path rust/Cargo.toml --locked

  julia:
    name: Julia tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - name: Run tests
        run: julia --project=julia julia/test/runtests.jl
